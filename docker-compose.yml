services:
  bot:
    build: .
    pull_policy: build
    container_name: bot_v2
    restart: always
    environment:
      TZ: Europe/Kyiv
      BOT_TOKEN: ${BOT_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      POWERCUT_CHAT_ID: ${POWERCUT_CHAT_ID}
      POWERCUT_PAGE_URL: ${POWERCUT_PAGE_URL}
      POWERCUT_MINIAPP_URL: ${POWERCUT_MINIAPP_URL}
      INSTAGRAM_COOKIES: ${INSTAGRAM_COOKIES}
    volumes:
      - bot_data:/data
    ports:
      - "10000:10000"

volumes:
  bot_data: