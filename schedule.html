:root[data-theme="dark"][data-queue="5.2"]{--b1:#38d11a;--b2:#13ae61;--b3:#a6c11f;--glow:rgba(95,240,66,0.4)}
:root[data-queue="6.1"]{--b1:#a276f9;--b2:#f76ef7;--b3:#a7c3fb;--glow:rgba(98,29,237,0.38)}
:root[data-theme="dark"][data-queue="6.1"]{--b1:#571ad1;--b2:#ae13ae;--b3:#1f55c1;--glow:rgba(124,66,240,0.4)}
:root[data-queue="6.2"]{--b1:#f9e376;--b2:#b3f76e;--b3:#fbb5a7;--glow:rgba(237,202,29,0.38)}
:root[data-theme="dark"][data-queue="6.2"]{--b1:#d1b21a;--b2:#61ae13;--b3:#c13a1f;--glow:rgba(240,211,66,0.4)}
:root[data-queue][data-state="on"]{--b3:#a7f3d0}
:root[data-queue][data-state="off"]{--b3:#fcd34d}
:root[data-theme="dark"][data-queue][data-state="on"]{--b3:#10b981}
:root[data-theme="dark"][data-queue][data-state="off"]{--b3:#d97706}
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="stage"><div class="glow" aria-hidden="true"></div>
<main class="card">
  <header>
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
      <div><h1>Графіки відключень</h1><small class="eyebrow"><i class="eb-dot"></i><span>Черкасиобленерго · <span id="date"></span></span></small></div>
    </div>
    <button class="tb" id="tb" aria-label="Темна тема">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div class="bar">
    <div class="live" id="live"><span class="dot"></span><span id="livet">завантаження…</span></div>
    <div class="seg" id="seg" role="group" aria-label="День"><span class="thumb"></span><button data-v="today" class="sel">Сьогодні</button><button data-v="tomorrow">Завтра</button></div>
  </div>
  <div class="chead"><span>Черги</span><span id="cnt"></span></div>
  <div class="chips" id="chips" role="group" aria-label="Черги"></div>
  <div class="wrap" id="wrap"><svg viewBox="-30 -30 360 360" id="svg" role="img" aria-label="Добовий годинник відключень"></svg><div class="center" id="center"><div class="tc"><small>Зараз</small><b id="now">--:--:--</b></div><div class="lab" id="lab"></div><div class="cd" id="cd"></div><div class="cl" id="cl"></div></div></div>
  <div class="list" id="list"></div>
  <p class="mut" id="upd"></p>
</main></div>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}"></script>
<script>
// Усі 12 черг показуються, але вмикаються лише ті, які реально парсить бот (поле "queues" в /api/schedule).
var QS=["1.1","1.2","2.1","2.2","3.1","3.2","4.1","4.2","5.1","5.2","6.1","6.2"];
var C=150,OUT=143,POLL=10000,FRESH=90,MINC=96,CAP=3,GEO={1:[18,21],2:[18,21],3:[18,21],4:[15,18],5:[13,16],6:[11,14]};
// геометрія кілець залежить від їх кількості: більше кілець — тонші; зовнішній край завжди на радіусі OUT
function geo(n){var g=GEO[Math.min(Math.max(n,1),6)];return{W:g[0],STEP:g[1],R0:OUT-g[0]/2}}
// вільний діаметр центру (одиниці viewBox), де має вміститись годинник і зворотний відлік
function freeD(n){var g=geo(n);return 2*(g.R0-(n-1)*g.STEP-g.W/2-8)}
// скільки кілець вміщується при поточній ширині кола (px): центр не менше MINC px
function measureCap(){var px=document.getElementById("wrap").getBoundingClientRect().width||300,c=1;for(var n=2;n<=6;n++)if(freeD(n)*px/360>=MINC)c=n;var ch=c!==CAP;CAP=c;return ch}
var $=function(i){return document.getElementById(i)};
var api=null,sel=[],animQ=null,view="today",sigs={},fetchedAt=0,failed=false,lastKey="",lastMin=-1;
var saved=[];try{saved=JSON.parse(localStorage.getItem("sel")||"[]")||[]}catch(e){}

/* ---------- час (Київ) ---------- */
function mkFmt(opts){try{return new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:"Europe/Kyiv"},opts))}catch(e){return new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:"Europe/Kiev"},opts))}}
var FM=mkFmt({hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
var DF=mkFmt({year:"numeric",month:"2-digit",day:"2-digit"});
function kyiv(){var o={};FM.formatToParts(new Date()).forEach(function(p){o[p.type]=+p.value});o.hour=o.hour%24;return o}
function nowMin(){var k=kyiv();return k.hour*60+k.minute+k.second/60}
function keyOf(){var o={};DF.formatToParts(new Date()).forEach(function(p){o[p.type]=p.value});return o.year+"-"+o.month+"-"+o.day}
function addDay(k,n){var p=k.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10)}
function viewKey(){return view==="tomorrow"?addDay(keyOf(),1):keyOf()}
function pad(x){return String(x).padStart(2,"0")}
function hm(m){if(m===1440)return"24:00";m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)}
function hhmm(ms){try{return new Date(ms).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Kyiv"})}catch(e){return""}}

/* ---------- дані бота ---------- */
function enabled(q){return !!(api&&api.queues&&api.queues.indexOf(q)>-1)}
function dayRec(q,key){var d=api&&api.days&&api.days[key];return d&&d[q]?d[q]:null}
function daySlots(q,key){var r=dayRec(q,key);return r?r.slots:null}
function hasTomorrow(){var k=addDay(keyOf(),1);return QS.some(function(q){return enabled(q)&&daySlots(q,k)!==null})}
// суцільна лінія часу: сьогодні + завтра (зсув 1440), сусідні інтервали зливаються (23:00–24:00 + 00:00–01:00)
function timeline(q){
  var t=[],a=daySlots(q,keyOf())||[],b=daySlots(q,addDay(keyOf(),1))||[];
  a.forEach(function(x){t.push({s:x.s,e:x.e})});
  b.forEach(function(x){t.push({s:x.s+1440,e:x.e+1440})});
  t.sort(function(x,y){return x.s-y.s});
  var m=[];t.forEach(function(x){var l=m[m.length-1];if(l&&x.s<=l.e)l.e=Math.max(l.e,x.e);else m.push({s:x.s,e:x.e})});
  return m;
}
function dayTag(m){return m>1440?" (завтра)":""}
function qStatus(q){
  if(daySlots(q,keyOf())===null)return{nodata:true,txt:"немає даних на сьогодні"};
  var n=nowMin(),cur=null,nx=null;
  timeline(q).forEach(function(x){if(n>=x.s&&n<x.e)cur=x;else if(x.s>n&&!nx)nx=x});
  if(cur)return{off:true,at:cur.e,txt:"до "+hm(cur.e)+dayTag(cur.e)};
  if(nx)return{off:false,next:true,at:nx.s,txt:"до "+hm(nx.s)+dayTag(nx.s)};
  return{off:false,at:null,txt:"до кінця доби"};
}

/* ---------- малювання ---------- */
function pt(m,r){var a=m/1440*2*Math.PI-Math.PI/2;return[C+r*Math.cos(a),C+r*Math.sin(a)]}
function arc(s,e,r){var p=pt(s,r),q=pt(e,r);return"M"+p[0].toFixed(2)+" "+p[1].toFixed(2)+"A"+r+" "+r+" 0 "+(e-s>720?1:0)+" 1 "+q[0].toFixed(2)+" "+q[1].toFixed(2)}
function defs(){return'<defs><linearGradient id="gOff" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="300"><stop offset="0" style="stop-color:var(--off1)"/><stop offset="1" style="stop-color:var(--off2)"/></linearGradient><linearGradient id="gOn" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="300" y2="0"><stop offset="0" style="stop-color:var(--on1)"/><stop offset="1" style="stop-color:var(--on2)"/></linearGradient></defs>'}
// шкала годин зовні кола (як на годиннику): 24 поділки, підписи кожні 3 год, північ угорі, за годинниковою стрілкою
function scale(){
  var E=OUT,h="";
  for(var i=0;i<24;i++){
    var a=i*15*Math.PI/180,sn=Math.sin(a),cs=-Math.cos(a),major=i%3===0,r1=E+5,r2=E+(major?13:9);
    h+='<line class="'+(major?"tkm":"tk")+'" x1="'+(C+r1*sn).toFixed(2)+'" y1="'+(C+r1*cs).toFixed(2)+'" x2="'+(C+r2*sn).toFixed(2)+'" y2="'+(C+r2*cs).toFixed(2)+'"/>';
    if(major){var rl=E+27;h+='<text class="hr'+(i%12===0?" k":"")+'" dy=".35em" x="'+(C+rl*sn).toFixed(2)+'" y="'+(C+rl*cs).toFixed(2)+'">'+i+'</text>'}
  }
  return h;
}
function arcP(a,b,cls,dl,r,W,st){return'<path class="arc off '+cls+st+'" pathLength="1" stroke-width="'+W+'" style="animation-delay:'+dl+'s" d="'+arc(a,b,r)+'"/>'}
function drawRings(){
  var g=geo(sel.length||1),W=g.W,R0=g.R0,STEP=g.STEP,h=defs()+scale(),vk=viewKey(),E=OUT,nm=view==='today'?nowMin():-1;
  sel.forEach(function(q,k){
    var r=R0-k*STEP;
    h+='<circle class="base" cx="150" cy="150" r="'+r+'" stroke-width="'+W+'"/><circle class="okring" cx="150" cy="150" r="'+r+'" stroke-width="'+W+'"/>';
    var st=(animQ&&animQ!==q)?" static":"";
    var sl=daySlots(q,vk)||[];
    var edge0=sl.some(function(x){return x.s===0&&x.e<1440}),edge24=sl.some(function(x){return x.e>=1440&&x.s>0}),G=(edge0&&edge24)?2.5:0;   // тонкий розрив на півночі між РІЗНИМИ відключеннями
    sl.forEach(function(x,i){
      var parts=(x.e-x.s>=1440)?[[x.s,x.s+720],[x.s+720,x.e]]:[[x.s,x.e]],dl=k*.12+i*.15;
      parts.forEach(function(p){
        var a=p[0],b=p[1];if(G){if(x.s===0&&a===0&&x.e<1440)a=G;if(x.e>=1440&&x.s>0&&b>=1440)b=1440-G}
        if(nm>a&&nm<b){h+=arcP(a,nm,"past",dl,r,W,st)+arcP(nm,b,"",dl,r,W,st)}   // триває зараз
        else h+=arcP(a,b,(nm>=0&&b<=nm)?"past":"",dl,r,W,st);
      });
    });
    h+='<text class="lbl" x="150" y="'+(150-r)+'" text-anchor="middle" dy=".35em" style="font-size:'+Math.min(10,W-2.5)+'px">'+q+'</text>';
  });
  // стрілка поточного часу: трикутник ззовні кільця + тонка лінія через усі кільця (обертається в tick())
  var inner=R0-(Math.max(sel.length,1)-1)*STEP-W/2;
  h+='<g id="hand"><line class="hl-b" x1="150" y1="'+(150-E)+'" x2="150" y2="'+(150-inner)+'"/>'+
     '<line class="hl" x1="150" y1="'+(150-E)+'" x2="150" y2="'+(150-inner)+'"/>'+
     '<path class="hp" d="M150 '+(150-E-1)+'L144 '+(150-E-13)+'L156 '+(150-E-13)+'Z"/></g>';
  $("svg").innerHTML=h;
  $("svg").setAttribute("class",view==="tomorrow"?"tm":"");
  $("center").style.width=((inner-8)*2/360*100)+"%";
}
function renderChips(){
  var lim=sel.length>=CAP;
  $("chips").innerHTML=QS.map(function(q){
    var on=enabled(q),s=sel.indexOf(q)>-1;
    return'<button class="chip'+(s?" sel":"")+(on?"":" dis")+(!s&&on&&lim?" cap":"")+'" data-q="'+q+'" aria-pressed="'+s+'" aria-disabled="'+(on?"false":"true")+'"'+(on?"":' title="Немає даних по цій черзі"')+'>'+q+'</button>';
  }).join("");
  $("cnt").textContent=sel.length+" з "+CAP;
}
function segUi(){
  var has=hasTomorrow();
  if(!has&&view==="tomorrow")view="today";
  $("seg").style.display=has?"flex":"none";
  var b=$("seg").querySelectorAll("button");
  for(var i=0;i<b.length;i++)b[i].className=b[i].getAttribute("data-v")===view?"sel":"";
}
function setDate(){
  try{$("date").textContent=new Date(viewKey()+"T12:00:00Z").toLocaleDateString("uk-UA",{day:"numeric",month:"long",timeZone:"UTC"})}catch(e){}
}
var liveC="",liveT="";
function setLive(c,t){if(c!==liveC){$("live").className=c;liveC=c}if(t!==liveT){$("livet").textContent=t;liveT=t}}
function liveUi(){
  if(failed)return setLive("live bad","немає зв'язку");
  if(!api)return setLive("live","завантаження…");
  if(api.checkedAt==null)return setLive("live stale","збираю дані…");
  var age=(api.serverTime-api.checkedAt+(Date.now()-fetchedAt))/1000,ok=age<=FRESH;
  setLive(ok?"live ok":"live stale",ok?"наживо":"застаріло");
}
function upd(){
  if(!api){$("upd").textContent="";return}
  if(!sel.length){$("upd").textContent=enabled(QS[0])||api.queues.length?"":"Бот ще не отримав графіків.";return}
  var m=0,vk=viewKey();sel.forEach(function(q){var r=dayRec(q,vk);if(r&&r.updatedAt)m=Math.max(m,r.updatedAt)});
  $("upd").textContent=m?"Останній графік у каналі опубліковано о "+hhmm(m):"";
}
function subText(q,vk){
  var sl=daySlots(q,vk),r=dayRec(q,vk),txt;
  if(sl===null)txt="немає даних на цей день";
  else if(!sl.length)txt="відключень немає";
  else txt=sl.slice().sort(function(a,b){return a.s-b.s}).map(function(x){return hm(x.s)+"–"+hm(x.e)}).join(" · ");
  if(r&&r.updatedAt)txt+=" · оновлено "+hhmm(r.updatedAt);
  return txt;
}
function tick(){
  var q0=sel[0]||"",rt=document.documentElement;if((rt.getAttribute("data-queue")||"")!==q0){if(q0)rt.setAttribute("data-queue",q0);else rt.removeAttribute("data-queue")}
  var n=nowMin(),rot="rotate("+(n/1440*360)+" 150 150)";
  var mk=Math.floor(n);if(mk!==lastMin){var f0=lastMin===-1;lastMin=mk;if(!f0&&api&&sel.length&&view==="today"){animQ="-";drawRings();rot="rotate("+(n/1440*360)+" 150 150)"}}
  var hd=$("hand");if(hd)hd.setAttribute("transform",rot);
  var k0=kyiv();$("now").textContent=pad(k0.hour)+":"+pad(k0.minute)+":"+pad(k0.second);
  liveUi();
  var kk=keyOf();if(api&&lastKey&&kk!==lastKey){lastKey=kk;animQ=null;segUi();setDate();drawRings();$("list").dataset.k="";}
  lastKey=kk;
  if(!api){$("lab").textContent="Завантаження";$("lab").className="lab";$("cd").textContent="";$("cl").textContent="";return}
  if(!sel.length){$("lab").textContent=api.queues.length?"Оберіть чергу":"Немає даних";$("lab").className="lab";$("cd").textContent="";$("cl").textContent="";return}
  var q=sel[0],s=qStatus(q);var st_=s.nodata?"idle":(s.off?"off":"on");if(document.documentElement.getAttribute("data-state")!==st_)document.documentElement.setAttribute("data-state",st_);
  var sec=s.at!=null?Math.max(0,Math.round((s.at-n)*60)):null;
  var cls="",lab;
  if(s.nodata){lab="Немає даних";sec=null}
  else if(s.off){cls="on";lab="До ввімкнення"}
  else if(s.next){cls="off";lab="До відключення"}
  else{cls="on";lab="Відключень більше немає"}
  $("lab").textContent=lab;$("lab").className="lab "+cls;
  $("cd").className="cd "+cls;
  $("cd").textContent=sec!=null?pad(Math.floor(sec/3600))+":"+pad(Math.floor(sec/60)%60)+":"+pad(sec%60):"";
  $("cl").textContent="черга "+q;
  if($("list").dataset.k!=="ok"){
    var h="",vk=viewKey();
    sel.forEach(function(q,i){
      h+='<div class="row" style="animation-delay:'+(i*.07)+'s"><span class="q">'+q+'</span><div><div class="st" id="st-'+q.replace(".","")+'"></div><div class="sub" id="sb-'+q.replace(".","")+'">'+subText(q,vk)+'</div></div></div>';
    });
    $("list").innerHTML=h;$("list").dataset.k="ok";
  }
  sel.forEach(function(q){
    var s=qStatus(q),col=s.nodata?"mut":(s.off?"off":"on");
    var txt=s.nodata?"Немає даних":(s.off?"Світла немає":"Світло є");
    var e=$("st-"+q.replace(".",""));
    var html='<span class="pill" style="background:var(--'+col+')"></span><b>'+txt+'</b> <span class="mut">'+s.txt+'</span>';
    if(e&&e.dataset.h!==html){e.innerHTML=html;e.dataset.h=html}
  });
}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},3000)}
function full(){renderChips();segUi();setDate();drawRings();$("list").dataset.k="";tick();upd()}

/* ---------- отримання даних від бота ---------- */
function applyApi(j){
  var first=!api,changed=[],prevQ=api?api.queues.join(","):"";
  var ns={};
  Object.keys(j.days||{}).forEach(function(k){Object.keys(j.days[k]).forEach(function(q){
    var sg=JSON.stringify(j.days[k][q].slots);ns[q+"|"+k]=sg;
    if(!first&&sigs[q+"|"+k]!==sg&&k===keyOf())changed.push(q);
  })});
  sigs=ns;api=j;fetchedAt=Date.now();failed=false;lastKey=keyOf();
  var en=QS.filter(enabled),trim=false;measureCap();
  if(first){
    sel=saved.filter(function(q){return en.indexOf(q)>-1}).slice(0,CAP);
    if(!sel.length)sel=(j.displayQueues||[]).filter(function(q){return en.indexOf(q)>-1}).slice(0,CAP);
    if(!sel.length&&en.length)sel=[en[0]];
  }else{var n0=sel.length;sel=sel.filter(function(q){return en.indexOf(q)>-1}).slice(0,CAP);trim=sel.length!==n0}
  var vis=changed.filter(function(q){return sel.indexOf(q)>-1});
  var redraw=first||changed.length||trim||prevQ!==j.queues.join(",");
  if(redraw){
    animQ=vis.length&&view==="today"?vis[0]:null;
    full();
    if(vis.length)toast("Графік черги "+vis[0]+" оновлено");
  }else{segUi();upd();liveUi()}
}
function poll(){
  if(document.hidden&&api)return;
  var ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},8000);
  fetch("/api/schedule",{cache:"no-store",signal:ctl?ctl.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})
    .then(function(j){clearTimeout(to);applyApi(j)})
    .catch(function(){clearTimeout(to);failed=true;liveUi()});
}

/* ---------- взаємодія ---------- */
$("chips").onclick=function(e){
  var b=e.target.closest?e.target.closest("button"):e.target,q=b&&b.dataset&&b.dataset.q;if(!q)return;
  if(b.classList.contains("dis")){toast("Немає даних по черзі "+q);return}
  var i=sel.indexOf(q);
  if(i>-1)sel.splice(i,1);else{if(sel.length>=CAP){toast("На цьому екрані вміщається до "+CAP+" черг");return}sel.push(q)}
  try{localStorage.setItem("sel",JSON.stringify(sel))}catch(x){}
  animQ=null;renderChips();drawRings();$("list").dataset.k="";tick();upd();
};
var rz=0;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){
  if(!api)return;var c0=CAP;measureCap();if(CAP===c0)return;
  var n0=sel.length;sel=sel.slice(0,CAP);animQ=null;full();
  if(sel.length<n0)toast("Показано "+sel.length+" "+(sel.length===1?"чергу":"черги")+": стільки вміщається у вікні");
},150)});
$("seg").onclick=function(e){
  var v=e.target.getAttribute&&e.target.getAttribute("data-v");if(!v||v===view)return;
  view=v;animQ=null;segUi();setDate();drawRings();$("list").dataset.k="";tick();upd();
};
