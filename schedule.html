<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);--bg: #f6f6f8;--bg2: #f6f6f8;--card: #ffffff;--ink: #111a4a;--tx: #3b3e47;--mut: #666a75;--line: #e3e4e8;--track: #ecedf1;--on: #44b48b;--off: #ec652b;--onx: #167e6c;--offx: #bf4a15;--brand: #111a4a;--on-brand: #ffffff;--halo: #ffffff;--tick: #a9acb6;--ring-on: 0.3;--shadow-card: 0 40px 32px rgba(0,0,0,.02), 0 22px 18px rgba(0,0,0,.03), 0 12px 10px rgba(0,0,0,.03), 0 7px 5px rgba(0,0,0,.04), 0 3px 2px rgba(0,0,0,.05), 0 0 0 1px #e3e4e8;--shadow-pop: 0 8px 24px rgba(17,26,74,.18), 0 1px 3px rgba(17,26,74,.12);color-scheme:light}@media(prefers-color-scheme: dark){:root:not([data-theme=light]){--bg: #03111a;--bg2: #0f2531;--card: #0a1b25;--ink: #eef3f6;--tx: #c2ccd3;--mut: #8ea0ab;--line: #1b3341;--track: #14303d;--on: #44b48b;--off: #ff7f4d;--onx: #94efb7;--offx: #ffa078;--brand: #eef3f6;--on-brand: #0a1b25;--halo: #0a1b25;--tick: #4d6573;--ring-on: 0.24;--shadow-card: 0 24px 48px rgba(0,0,0,.45), 0 0 0 1px #1b3341;--shadow-pop: 0 8px 24px rgba(0,0,0,.55), 0 0 0 1px #1b3341;color-scheme:dark}}:root[data-theme=dark]{--bg: #03111a;--bg2: #0f2531;--card: #0a1b25;--ink: #eef3f6;--tx: #c2ccd3;--mut: #8ea0ab;--line: #1b3341;--track: #14303d;--on: #44b48b;--off: #ff7f4d;--onx: #94efb7;--offx: #ffa078;--brand: #eef3f6;--on-brand: #0a1b25;--halo: #0a1b25;--tick: #4d6573;--ring-on: 0.24;--shadow-card: 0 24px 48px rgba(0,0,0,.45), 0 0 0 1px #1b3341;--shadow-pop: 0 8px 24px rgba(0,0,0,.55), 0 0 0 1px #1b3341;color-scheme:dark}html{scroll-padding-top:env(safe-area-inset-top, 0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}button{font-family:inherit;-webkit-appearance:none;appearance:none}svg{display:block}body{margin:0;display:flex;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--tx);font:400 14px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}.mut{color:var(--mut)}html.tx,html.tx *{transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease,fill .3s ease,stroke .3s ease !important}.card{width:100%;max-width:440px;padding:24px;background:var(--card);border-radius:8px;box-shadow:var(--shadow-card)}.card>*{animation:rise .5s cubic-bezier(0.2, 0.7, 0.2, 1) both}.card>:nth-child(1){animation-delay:0s}.card>:nth-child(2){animation-delay:0.06s}.card>:nth-child(3){animation-delay:0.12s}.card>:nth-child(4){animation-delay:0.18s}.card>:nth-child(5){animation-delay:0.24s}.card>:nth-child(6){animation-delay:0.3s}.card>:nth-child(7){animation-delay:0.36s}.card>:nth-child(8){animation-delay:0.42s}@keyframes rise{from{opacity:0;transform:translateY(12px)}}header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--brand);color:var(--on-brand)}.logo svg{width:20px;height:20px}h1{margin:0;font:600 18px/1.2 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-0.01em;color:var(--ink)}.eyebrow{display:flex;align-items:center;gap:8px;margin-top:4px;font:500 11px/1.3 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.eyebrow .eb-dot{width:6px;height:6px;border-radius:50%;background:var(--on);flex:none}.tb{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:8px;background:rgba(0,0,0,0);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:transform .16s cubic-bezier(0.2, 0.7, 0.2, 1),background-color .16s,color .16s,box-shadow .16s}.tb:active:not([aria-disabled=true]){transform:scale(0.96)}.tb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}.tb svg{width:20px;height:20px}.tb .i-sun{display:none}@media(hover: hover){.tb:hover{background:var(--bg)}}:root[data-theme=dark] .tb .i-moon{display:none}:root[data-theme=dark] .tb .i-sun{display:block}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px}.live{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:0 12px 0 10px;border-radius:9999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font:500 12px/1 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--mut)}.live .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--mut)}.live.ok .dot{background:var(--on)}.live.ok .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--on);animation:pulse 2.2s cubic-bezier(0.2, 0.7, 0.2, 1) infinite}.live.stale .dot{background:#f2a20f}.live.bad .dot{background:var(--off)}@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3);opacity:0}}.seg{position:relative;display:none;margin-left:auto;padding:3px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}.seg button{position:relative;z-index:1;flex:1 1 0;min-width:72px;height:36px;padding:0 14px;border:0;border-radius:6px;background:rgba(0,0,0,0);color:var(--mut);font:500 13px/1 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;transition:transform .16s cubic-bezier(0.2, 0.7, 0.2, 1),background-color .16s,color .16s,box-shadow .16s}.seg button:active:not([aria-disabled=true]){transform:scale(0.96)}.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}.seg button.sel{background:var(--brand);color:var(--on-brand)}.seg .thumb{display:none;pointer-events:none}@supports selector(:has(*)){.seg .thumb{display:block;position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:6px;background:var(--brand);transition:transform .25s cubic-bezier(0.2, 0.7, 0.2, 1)}.seg button.sel{background:rgba(0,0,0,0)}.seg:has(button[data-v=tomorrow].sel) .thumb{transform:translateX(100%)}}.chips{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 4px}.chip{position:relative;min-width:52px;height:34px;padding:0 14px;border:0;border-radius:8px;background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line);font:500 13px/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums;cursor:pointer;transition:transform .16s cubic-bezier(0.2, 0.7, 0.2, 1),background-color .16s,color .16s,box-shadow .16s}.chip:active:not([aria-disabled=true]){transform:scale(0.96)}.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}.chip::before{content:"";position:absolute;inset:-5px}.chip.sel{background:var(--brand);color:var(--on-brand);box-shadow:none}.chip.dis{opacity:.4;cursor:not-allowed}@media(hover: hover){.chip:not(.sel):not(.dis):hover{background:var(--bg)}}.wrap{position:relative;width:100%;max-width:380px;height:0;margin:20px auto 12px;padding-bottom:100%}svg#svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.base{fill:none;stroke:var(--track)}.okring{fill:none;stroke:var(--on);opacity:var(--ring-on)}.arc{fill:none;stroke-linecap:butt;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards}.arc.static{animation:none;stroke-dashoffset:0}.arc.off{stroke:var(--off)}.arc.maybe{stroke:#f2a20f}@keyframes draw{to{stroke-dashoffset:0}}.tk{stroke:var(--tick);stroke-width:1.2;stroke-linecap:round}.tkm{stroke:var(--ink);stroke-width:2;stroke-linecap:round}.hr{font:500 11.5px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:var(--mut);text-anchor:middle;pointer-events:none}.hr.k{fill:var(--ink)}.lbl{font:500 10px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}.hl-b{stroke:var(--halo);stroke-width:5;stroke-linecap:round}.hl{stroke:var(--ink);stroke-width:2;stroke-linecap:round}.hp{fill:var(--ink);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}svg.tm #hand{display:none}.center{position:absolute;left:50%;top:50%;transform:translate(-50%, -50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.tc{margin-bottom:8px;padding:6px 12px 7px;background:var(--card);border-radius:8px;box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(17,26,74,.06)}.tc small{display:block;font:500 10px/1.2 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.tc b{display:block;font:500 14px/1.35 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink)}.lab{margin-top:4px;font:600 10px/1.25 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.cd{margin-top:2px;font:500 18px/1.2 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink)}.cl{margin-top:2px;font:400 11px/1.2 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:var(--mut)}.lab.on,.cd.on{color:var(--onx)}.lab.off,.cd.off{color:var(--offx)}.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}.row{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;background:var(--bg2);box-shadow:0 0 0 1px var(--line);animation:rise .4s cubic-bezier(0.2, 0.7, 0.2, 1) both}.q{font:500 13px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:var(--ink)}.st{font-size:14px;color:var(--ink)}.st b{font-weight:600}.st .mut{font-weight:400}.sub{margin-top:2px;font:400 12px/1.5 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:var(--mut)}.pill{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;vertical-align:1px}.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font-size:12px;color:var(--mut)}.legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--c);vertical-align:0}#upd{margin:12px 0 0;font-size:12px}.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top, 0px));z-index:9;display:flex;align-items:center;padding:10px 16px;border-radius:8px;background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow-pop);font:500 13px/1.3 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;opacity:0;transform:translate(-50%, -160%);transition:transform .45s cubic-bezier(0.34, 1.56, 0.64, 1),opacity .2s;pointer-events:none}.toast::before{content:"";flex:none;width:8px;height:8px;margin-right:10px;border-radius:50%;background:#44b48b}.toast.show{opacity:1;transform:translate(-50%, 0)}@media(prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}.arc{animation:none;stroke-dashoffset:0}.live.ok .dot::after{display:none}}</style>

<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<main class="card">
  <header>
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
      <div><h1>Графіки відключень</h1><small class="eyebrow"><i class="eb-dot"></i><span>Черкасиобленерго · <span id="date"></span></span></small></div>
    </div>
    <button class="tb" id="tb" aria-label="Темна тема">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div class="bar">
    <div class="live" id="live"><span class="dot"></span><span id="livet">завантаження…</span></div>
    <div class="seg" id="seg" role="group" aria-label="День"><span class="thumb"></span><button data-v="today" class="sel">Сьогодні</button><button data-v="tomorrow">Завтра</button></div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Черги"></div>
  <div class="wrap" id="wrap"><svg viewBox="-30 -30 360 360" id="svg" role="img" aria-label="Добовий годинник відключень"></svg><div class="center" id="center"><div class="tc"><small>Зараз</small><b id="now">--:--:--</b></div><div class="lab" id="lab"></div><div class="cd" id="cd"></div><div class="cl" id="cl"></div></div></div>
  <div class="list" id="list"></div>
  <div class="legend"><span style="--c:var(--on)">Світло є</span><span style="--c:var(--off)">Відключення</span></div>
  <p class="mut" id="upd"></p>
</main>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}"></script>
<script>
// Усі 12 черг показуються, але вмикаються лише ті, які реально парсить бот (поле "queues" в /api/schedule).
var QS=["1.1","1.2","2.1","2.2","3.1","3.2","4.1","4.2","5.1","5.2","6.1","6.2"];
var MAX=4,C=150,R0=134,W=18,STEP=21,POLL=10000,FRESH=90;
var $=function(i){return document.getElementById(i)};
var api=null,sel=[],animQ=null,view="today",sigs={},fetchedAt=0,failed=false,lastKey="";
var saved=[];try{saved=JSON.parse(localStorage.getItem("sel")||"[]")||[]}catch(e){}

/* ---------- час (Київ) ---------- */
function mkFmt(opts){try{return new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:"Europe/Kyiv"},opts))}catch(e){return new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:"Europe/Kiev"},opts))}}
var FM=mkFmt({hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
var DF=mkFmt({year:"numeric",month:"2-digit",day:"2-digit"});
function kyiv(){var o={};FM.formatToParts(new Date()).forEach(function(p){o[p.type]=+p.value});o.hour=o.hour%24;return o}
function nowMin(){var k=kyiv();return k.hour*60+k.minute+k.second/60}
function keyOf(){var o={};DF.formatToParts(new Date()).forEach(function(p){o[p.type]=p.value});return o.year+"-"+o.month+"-"+o.day}
function addDay(k,n){var p=k.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10)}
function viewKey(){return view==="tomorrow"?addDay(keyOf(),1):keyOf()}
function pad(x){return String(x).padStart(2,"0")}
function hm(m){if(m===1440)return"24:00";m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)}
function hhmm(ms){try{return new Date(ms).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Kyiv"})}catch(e){return""}}

/* ---------- дані бота ---------- */
function enabled(q){return !!(api&&api.queues&&api.queues.indexOf(q)>-1)}
function dayRec(q,key){var d=api&&api.days&&api.days[key];return d&&d[q]?d[q]:null}
function daySlots(q,key){var r=dayRec(q,key);return r?r.slots:null}
function hasTomorrow(){var k=addDay(keyOf(),1);return QS.some(function(q){return enabled(q)&&daySlots(q,k)!==null})}
// суцільна лінія часу: сьогодні + завтра (зсув 1440), сусідні інтервали зливаються (23:00–24:00 + 00:00–01:00)
function timeline(q){
  var t=[],a=daySlots(q,keyOf())||[],b=daySlots(q,addDay(keyOf(),1))||[];
  a.forEach(function(x){t.push({s:x.s,e:x.e})});
  b.forEach(function(x){t.push({s:x.s+1440,e:x.e+1440})});
  t.sort(function(x,y){return x.s-y.s});
  var m=[];t.forEach(function(x){var l=m[m.length-1];if(l&&x.s<=l.e)l.e=Math.max(l.e,x.e);else m.push({s:x.s,e:x.e})});
  return m;
}
function dayTag(m){return m>1440?" (завтра)":""}
function status(q){
  if(daySlots(q,keyOf())===null)return{nodata:true,txt:"немає даних на сьогодні"};
  var n=nowMin(),cur=null,nx=null;
  timeline(q).forEach(function(x){if(n>=x.s&&n<x.e)cur=x;else if(x.s>n&&!nx)nx=x});
  if(cur)return{off:true,at:cur.e,txt:"до "+hm(cur.e)+dayTag(cur.e)};
  if(nx)return{off:false,next:true,at:nx.s,txt:"до "+hm(nx.s)+dayTag(nx.s)};
  return{off:false,at:null,txt:"до кінця доби"};
}

/* ---------- малювання ---------- */
function pt(m,r){var a=m/1440*2*Math.PI-Math.PI/2;return[C+r*Math.cos(a),C+r*Math.sin(a)]}
function arc(s,e,r){var p=pt(s,r),q=pt(e,r);return"M"+p[0].toFixed(2)+" "+p[1].toFixed(2)+"A"+r+" "+r+" 0 "+(e-s>720?1:0)+" 1 "+q[0].toFixed(2)+" "+q[1].toFixed(2)}
// шкала годин зовні кола (як на годиннику): 24 поділки, підписи кожні 3 год, північ угорі, за годинниковою стрілкою
function scale(){
  var E=R0+W/2,h="";
  for(var i=0;i<24;i++){
    var a=i*15*Math.PI/180,sn=Math.sin(a),cs=-Math.cos(a),major=i%3===0,r1=E+5,r2=E+(major?13:9);
    h+='<line class="'+(major?"tkm":"tk")+'" x1="'+(C+r1*sn).toFixed(2)+'" y1="'+(C+r1*cs).toFixed(2)+'" x2="'+(C+r2*sn).toFixed(2)+'" y2="'+(C+r2*cs).toFixed(2)+'"/>';
    if(major){var rl=E+27;h+='<text class="hr'+(i%12===0?" k":"")+'" dy=".35em" x="'+(C+rl*sn).toFixed(2)+'" y="'+(C+rl*cs).toFixed(2)+'">'+i+'</text>'}
  }
  return h;
}
function drawRings(){
  var h=scale(),vk=viewKey(),E=R0+W/2;
  sel.forEach(function(q,k){
    var r=R0-k*STEP;
    h+='<circle class="base" cx="150" cy="150" r="'+r+'" stroke-width="'+W+'"/><circle class="okring" cx="150" cy="150" r="'+r+'" stroke-width="'+W+'"/>';
    (daySlots(q,vk)||[]).forEach(function(x,i){
      var st=(animQ&&animQ!==q)?" static":"",parts=(x.e-x.s>=1440)?[[x.s,x.s+720],[x.s+720,x.e]]:[[x.s,x.e]];
      parts.forEach(function(p){h+='<path class="arc '+x.t+st+'" pathLength="1" stroke-width="'+W+'" style="animation-delay:'+(k*.12+i*.15)+'s" d="'+arc(p[0],p[1],r)+'"/>'});
    });
    h+='<text class="lbl" x="150" y="'+(150-r)+'" text-anchor="middle" dy=".35em">'+q+'</text>';
  });
  // стрілка поточного часу: трикутник ззовні кільця + тонка лінія через усі кільця (обертається в tick())
  var inner=R0-(Math.max(sel.length,1)-1)*STEP-W/2;
  h+='<g id="hand"><line class="hl-b" x1="150" y1="'+(150-E)+'" x2="150" y2="'+(150-inner)+'"/>'+
     '<line class="hl" x1="150" y1="'+(150-E)+'" x2="150" y2="'+(150-inner)+'"/>'+
     '<path class="hp" d="M150 '+(150-E-1)+'L144 '+(150-E-13)+'L156 '+(150-E-13)+'Z"/></g>';
  $("svg").innerHTML=h;
  $("svg").setAttribute("class",view==="tomorrow"?"tm":"");
  $("center").style.width=((inner-8)*2/360*100)+"%";
}
function renderChips(){
  $("chips").innerHTML=QS.map(function(q){
    var on=enabled(q);
    return'<button class="chip'+(sel.indexOf(q)>-1?" sel":"")+(on?"":" dis")+'" data-q="'+q+'" aria-disabled="'+(on?"false":"true")+'"'+(on?"":' title="Бот поки не парсить цю чергу"')+'>'+q+'</button>';
  }).join("");
}
function segUi(){
  var has=hasTomorrow();
  if(!has&&view==="tomorrow")view="today";
  $("seg").style.display=has?"flex":"none";
  var b=$("seg").querySelectorAll("button");
  for(var i=0;i<b.length;i++)b[i].className=b[i].getAttribute("data-v")===view?"sel":"";
}
function setDate(){
  try{$("date").textContent=new Date(viewKey()+"T12:00:00Z").toLocaleDateString("uk-UA",{day:"numeric",month:"long",timeZone:"UTC"})}catch(e){}
}
function liveUi(){
  var el=$("live"),t=$("livet");
  if(failed){el.className="live bad";t.textContent="немає зв'язку з сервером";return}
  if(!api){el.className="live";t.textContent="завантаження…";return}
  if(api.checkedAt==null){el.className="live stale";t.textContent="бот ще збирає дані";return}
  var age=Math.max(0,Math.round((api.serverTime-api.checkedAt+(Date.now()-fetchedAt))/1000));
  var txt=age<60?age+" с":Math.floor(age/60)+" хв";
  if(age<=FRESH){el.className="live ok";t.textContent="наживо · перевірено "+txt+" тому"}
  else{el.className="live stale";t.textContent="дані застаріли · остання перевірка "+txt+" тому"}
}
function upd(){
  if(!api){$("upd").textContent="";return}
  if(!sel.length){$("upd").textContent=enabled(QS[0])||api.queues.length?"":"Бот ще не отримав графіків.";return}
  var m=0,vk=viewKey();sel.forEach(function(q){var r=dayRec(q,vk);if(r&&r.updatedAt)m=Math.max(m,r.updatedAt)});
  $("upd").textContent=m?"Останній графік у каналі опубліковано о "+hhmm(m):"";
}
function tick(){
  var n=nowMin(),rot="rotate("+(n/1440*360)+" 150 150)";
  var hd=$("hand");if(hd)hd.setAttribute("transform",rot);
  var k0=kyiv();$("now").textContent=pad(k0.hour)+":"+pad(k0.minute)+":"+pad(k0.second);
  liveUi();
  var kk=keyOf();if(api&&lastKey&&kk!==lastKey){lastKey=kk;animQ=null;segUi();setDate();drawRings();$("list").dataset.k="";}
  lastKey=kk;
  if(!api){$("lab").textContent="Завантаження";$("lab").className="lab";$("cd").textContent="";$("cl").textContent="";return}
  if(!sel.length){$("lab").textContent=api.queues.length?"Оберіть чергу":"Немає даних";$("lab").className="lab";$("cd").textContent="";$("cl").textContent="";return}
  var q=sel[0],s=status(q);
  var sec=s.at!=null?Math.max(0,Math.round((s.at-n)*60)):null;
  var cls="",lab;
  if(s.nodata){lab="Немає даних";sec=null}
  else if(s.off){cls="on";lab="До ввімкнення"}
  else if(s.next){cls="off";lab="До відключення"}
  else{cls="on";lab="Відключень більше немає"}
  $("lab").textContent=lab;$("lab").className="lab "+cls;
  $("cd").className="cd "+cls;
  $("cd").textContent=sec!=null?pad(Math.floor(sec/3600))+":"+pad(Math.floor(sec/60)%60)+":"+pad(sec%60):"";
  $("cl").textContent="черга "+q;
  if($("list").dataset.k!=="ok"){
    var h="",vk=viewKey();
    sel.forEach(function(q,i){
      var sl=daySlots(q,vk),r=dayRec(q,vk),txt;
      if(sl===null)txt="немає даних на цей день";
      else if(!sl.length)txt="відключень немає";
      else txt=sl.slice().sort(function(a,b){return a.s-b.s}).map(function(x){return hm(x.s)+"–"+hm(x.e)}).join(" · ");
      if(r&&r.updatedAt)txt+=" · оновлено "+hhmm(r.updatedAt);
      h+='<div class="row" style="animation-delay:'+(i*.07)+'s"><span class="q">'+q+'</span><div><div class="st" id="st-'+q.replace(".","")+'"></div><div class="sub">'+txt+'</div></div></div>';
    });
    $("list").innerHTML=h;$("list").dataset.k="ok";
  }
  sel.forEach(function(q){
    var s=status(q),col=s.nodata?"mut":(s.off?"off":"on");
    var txt=s.nodata?"Немає даних":(s.off?"Світла немає":"Світло є");
    var e=$("st-"+q.replace(".",""));
    var html='<span class="pill" style="background:var(--'+col+')"></span><b>'+txt+'</b> <span class="mut">'+s.txt+'</span>';
    if(e&&e.dataset.h!==html){e.innerHTML=html;e.dataset.h=html}
  });
}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},3000)}
function full(){renderChips();segUi();setDate();drawRings();$("list").dataset.k="";tick();upd()}

/* ---------- отримання даних від бота ---------- */
function applyApi(j){
  var first=!api,changed=[],prevQ=api?api.queues.join(","):"";
  var ns={};
  Object.keys(j.days||{}).forEach(function(k){Object.keys(j.days[k]).forEach(function(q){
    var sg=JSON.stringify(j.days[k][q].slots);ns[q+"|"+k]=sg;
    if(!first&&sigs[q+"|"+k]!==sg&&k===keyOf())changed.push(q);
  })});
  sigs=ns;api=j;fetchedAt=Date.now();failed=false;lastKey=keyOf();
  var en=QS.filter(enabled);
  if(first){
    sel=saved.filter(function(q){return en.indexOf(q)>-1}).slice(0,MAX);
    if(!sel.length&&en.length)sel=[en.indexOf("2.1")>-1?"2.1":en[0]];
  }else sel=sel.filter(function(q){return en.indexOf(q)>-1});
  var vis=changed.filter(function(q){return sel.indexOf(q)>-1});
  var redraw=first||changed.length||prevQ!==j.queues.join(",");
  if(redraw){
    animQ=vis.length&&view==="today"?vis[0]:null;
    full();
    if(vis.length)toast("Графік черги "+vis[0]+" оновлено");
  }else{segUi();upd();liveUi()}
}
function poll(){
  if(document.hidden&&api)return;
  var ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},8000);
  fetch("/api/schedule",{cache:"no-store",signal:ctl?ctl.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})
    .then(function(j){clearTimeout(to);applyApi(j)})
    .catch(function(){clearTimeout(to);failed=true;liveUi()});
}

/* ---------- взаємодія ---------- */
$("chips").onclick=function(e){
  var b=e.target.closest?e.target.closest("button"):e.target,q=b&&b.dataset&&b.dataset.q;if(!q)return;
  if(b.classList.contains("dis")){toast("Бот поки не парсить чергу "+q);return}
  var i=sel.indexOf(q);
  if(i>-1)sel.splice(i,1);else{if(sel.length>=MAX){toast("Можна показати до "+MAX+" черг");return}sel.push(q)}
  try{localStorage.setItem("sel",JSON.stringify(sel))}catch(x){}
  animQ=null;renderChips();drawRings();$("list").dataset.k="";tick();upd();
};
$("seg").onclick=function(e){
  var v=e.target.getAttribute&&e.target.getAttribute("data-v");if(!v||v===view)return;
  view=v;animQ=null;segUi();setDate();drawRings();$("list").dataset.k="";tick();upd();
};
function setTheme(m,save){var r=document.documentElement;if(save){r.classList.add("tx");setTimeout(function(){r.classList.remove("tx")},400)}r.setAttribute("data-theme",m);$("tb").setAttribute("aria-label",m=="dark"?"Світла тема":"Темна тема");if(save)try{localStorage.setItem("theme",m)}catch(e){}}
var th=null;try{th=localStorage.getItem("theme")}catch(e){}
setTheme(th||(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),false);
$("tb").onclick=function(){setTheme(document.documentElement.getAttribute("data-theme")=="dark"?"light":"dark",true)};
document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()});

renderChips();setDate();drawRings();tick();
setInterval(tick,1000);
poll();setInterval(poll,POLL);
</script>
</body>
</html>
